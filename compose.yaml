services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: vpnpanel-app
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks: [panel]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [panel]

  worker:
    image: vpnpanel-app
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    command: ["supervisord", "-c", "/etc/supervisor/supervisord.conf"]
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_healthy
    networks: [panel]

  # نود VPN محلی — روی همین سروری که پنل اجرا می‌شود.
  # با `php artisan panel:setup-local-node` پیکربندی و فعال می‌شود.
  xray:
    image: ghcr.io/xtls/xray-core:latest
    restart: unless-stopped
    profiles: ["vpn"]
    volumes:
      - ./docker/xray:/usr/local/etc/xray:ro
    ports:
      - "${XRAY_PORT:-443}:${XRAY_PORT:-443}"
    networks: [panel]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-vpnpanel}
      MYSQL_USER: ${DB_USERNAME:-vpnpanel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [panel]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [panel]

volumes:
  mysql-data:
  redis-data:

networks:
  panel:
    driver: bridge
